
<svg xmlns="http://www.w3.org/2000/svg"
    width="600" height="400"
    viewBox="0 0 600 400">

    <!-- White background -->
    <rect width="600" height="400" fill="#FFFFFF"/>

    <!-- Red vertical stripe -->
    <rect x="0" y="0" width="150" height="400" fill="#FF0000"/>

    <!-- Green stripe -->
    <rect x="150" y="0" width="450" height="133.33" fill="#00732F"/>

    <!-- White stripe -->
    <rect x="150" y="133.33" width="450" height="133.34" fill="#FFFFFF"/>

    <!-- Black stripe -->
    <rect x="150" y="266.67" width="450" height="133.33" fill="#000000"/>

</svg>
